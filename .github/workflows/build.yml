name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -o MeuLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        working-directory: MeuLauncher
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MeuLauncher-apk
          path: MeuLauncher/app/build/outputs/apk/debug/app-debug.apk
